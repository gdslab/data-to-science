name: Build geo base image

# Builds the native geospatial stack (GDAL, PDAL, PROJ, GEOS, Untwine) that
# backend.dockerfile builds on top of. This takes upwards of an hour, so it runs
# only when geobase.dockerfile changes or when triggered by hand -- the
# application image build does not compile any of it.
#
# Pushing to main only builds and smoke-tests; it does not publish. Publishing is
# a deliberate act: run this workflow from the Actions tab with push set to true,
# which matches how the other images ship through helpers/build_and_deploy.sh.
#
# The geospatial pins in backend/pyproject.toml describe the same libraries this
# image provides, so republishing after a version change and updating those pins
# belong in the same pull request.

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push to Docker Hub after the smoke test passes
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - backend/geobase.dockerfile
      - .github/workflows/geo-base.yml

env:
  IMAGE: gdslab/d2s-geo-base:latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/geobase.dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The raster fixture has to be mounted for the COG, JPEG and hillshade
      # checks to run; without it the script fails rather than skipping past them.
      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/backend/scripts:/scripts:ro" \
            -v "$PWD/backend/app/tests/data:/app/app/tests/data:ro" \
            ${{ env.IMAGE }} bash /scripts/verify_geo_stack.sh --cli-only

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: inputs.push
        run: docker push ${{ env.IMAGE }}
