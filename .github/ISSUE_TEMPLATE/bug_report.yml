name: Bug report
description: Report a bug or unexpected behavior in D2S
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A brief description of the problem and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce the issue.
      placeholder: |
        1. Navigate to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Deployment method, browser, and D2S version or commit.
      placeholder: "e.g., quickstart Docker Compose, Chrome 138, commit cc10742"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any relevant log output (backend, browser console, Celery). This will be formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Screenshots or recordings that help illustrate the problem.
    validations:
      required: false
